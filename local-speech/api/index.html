<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sound Flux Voice Companion</title>
  <style>
    body { font: 16px system-ui; max-width: 1100px; margin: 3rem auto; padding: 0 1rem; }
    button, input { font: inherit; padding: .65rem 1rem; } #recording { background: #b42318; color: white; }
    form { display: flex; gap: .5rem; } input { flex: 1; min-width: 0; }
    section { margin: 1.5rem 0; } #transcript, #answer { white-space: pre-wrap; min-height: 2em; }
    small { color: #666; }
    #welcome, #onboarding { margin: 1rem 0; } #onboarding { color: #555; }
    table { border-collapse: collapse; width: 100%; } th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    details { margin: 1.5rem 0; } summary { cursor: pointer; font-weight: 600; } #clear-data, #clear-history { margin-top: 1rem; }
  </style>
  <h1>Sound Flux Voice Companion</h1>
  <button id="record">Start listening</button>
  <small id="status">Continuous listening. Use headphones to avoid feedback.</small>
  <p id="welcome"></p>
  <p id="onboarding"></p>
  <section><strong>You</strong><div id="transcript"></div></section>
  <section><strong>Companion</strong><div id="answer"></div></section>
  <audio id="reply" controls></audio>
  <section>
    <form id="message-form">
      <input id="message" placeholder="Say or type a message" autocomplete="off">
      <button>Ask companion</button>
    </form>
  </section>
  <details>
    <summary>Debug data</summary>
    <section>
      <strong>Profile properties</strong>
      <table><thead><tr><th>Category</th><th>Property</th><th>Value</th><th>Updated</th></tr></thead><tbody id="profile-rows"></tbody></table>
      <strong>Music preferences</strong>
      <table><thead><tr><th>Preference</th></tr></thead><tbody id="preference-rows"></tbody></table>
      <strong>Memorable items</strong>
      <table><thead><tr><th>Kind</th><th>Value</th></tr></thead><tbody id="memory-rows"></tbody></table>
      <strong>Chat history</strong>
      <table><thead><tr><th>Time</th><th>You</th><th>Model</th><th>Companion</th><th>Duration</th></tr></thead><tbody id="history-rows"></tbody></table>
      <button id="clear-history" type="button">Clear chat history</button>
      <button id="clear-data" type="button">Clear all saved data</button>
    </section>
  </details>
  <script id="initial-state" type="application/json">__INITIAL_STATE__</script>
  <script>
    const button = document.querySelector('#record');
    const status = document.querySelector('#status');
    const transcript = document.querySelector('#transcript');
    const answer = document.querySelector('#answer');
    const player = document.querySelector('#reply');
    const messageForm = document.querySelector('#message-form');
    const messageInput = document.querySelector('#message');
    const welcome = document.querySelector('#welcome');
    const onboarding = document.querySelector('#onboarding');
    const profileRows = document.querySelector('#profile-rows');
    const preferenceRows = document.querySelector('#preference-rows');
    const memoryRows = document.querySelector('#memory-rows');
    const historyRows = document.querySelector('#history-rows');
    const clearData = document.querySelector('#clear-data');
    const clearHistory = document.querySelector('#clear-history');
    let profileState = JSON.parse(document.querySelector('#initial-state').textContent);
    let savedHistory = [];
    const history = [];
    const SILENCE_MS = 1200;
    const SPEECH_THRESHOLD = 0.01;
    let socket, stream, context, source, processor, controller, turnId, audioFrames;
    let continuous = false, endingTurn = false, speechSeen = false, lastSpeechAt = 0, promptedOnboardingKey = null;

    const newTurn = () => crypto.randomUUID();

    function renderProfile() {
      welcome.textContent = profileState.greeting;
      const currentQuestion = promptedOnboardingKey ? profileState.questions[promptedOnboardingKey] : profileState.onboarding;
      onboarding.textContent = currentQuestion ? `${currentQuestion.category} · Optional profile question: ${currentQuestion.question}` : '';
      messageInput.placeholder = 'Say or type a message';
      profileRows.replaceChildren(...profileState.properties.map(property => {
        const row = document.createElement('tr');
        for (const value of [property.category, property.label, property.value, property.updated_at]) {
          const cell = document.createElement('td'); cell.textContent = value; row.append(cell);
        }
        return row;
      }));
      preferenceRows.replaceChildren(...profileState.music_preferences.map(item => {
        const row = document.createElement('tr');
        const cell = document.createElement('td'); cell.textContent = item.value; row.append(cell);
        return row;
      }));
      memoryRows.replaceChildren(...profileState.memorable_items.map(item => {
        const row = document.createElement('tr');
        for (const value of [item.kind, item.value]) {
          const cell = document.createElement('td'); cell.textContent = value; row.append(cell);
        }
        return row;
      }));
    }

    async function refreshProfile() {
      profileState = await fetch('/v1/profile').then(response => response.json());
      renderProfile();
    }

    function renderHistory() {
      historyRows.replaceChildren(...savedHistory.map(item => {
        const row = document.createElement('tr');
        for (const value of [item.created_at.slice(11, 16), item.user, item.model, item.assistant, `${item.duration_ms} ms`]) {
          const cell = document.createElement('td'); cell.textContent = value; row.append(cell);
        }
        return row;
      }));
    }

    async function refreshHistory() {
      savedHistory = (await fetch('/v1/history').then(response => response.json())).items;
      renderHistory();
    }

    clearData.onclick = async () => {
      if (!confirm('Clear all saved profile and chat data?')) return;
      const response = await fetch('/v1/data', { method: 'DELETE' });
      if (!response.ok) { status.textContent = 'Could not clear saved data.'; return; }
      profileState = await response.json();
      history.length = 0; savedHistory = []; transcript.textContent = ''; answer.textContent = '';
      player.pause(); player.removeAttribute('src'); player.load();
      renderProfile(); renderHistory(); status.textContent = 'Saved data cleared.';
    };

    clearHistory.onclick = async () => {
      if (!confirm('Clear chat history but keep profile properties?')) return;
      const response = await fetch('/v1/history', { method: 'DELETE' });
      if (!response.ok) { status.textContent = 'Could not clear chat history.'; return; }
      history.length = 0; savedHistory = []; renderHistory(); await refreshProfile();
      status.textContent = 'Chat history cleared.';
    };

    async function interrupt() {
      controller?.abort();
      player.pause(); player.currentTime = 0;
      socket?.close(); socket = null;
      if (turnId) await fetch(`/v1/turns/${turnId}/interrupt`, { method: 'POST' });
    }

    function stopCapture() {
      processor?.disconnect(); source?.disconnect(); context?.close();
      stream?.getTracks().forEach(track => track.stop());
      processor = source = context = stream = null;
    }

    async function speak(text) {
      const speech = await fetch('/v1/speech', {
        method: 'POST', signal: controller?.signal, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turn_id: turnId, text }),
      });
      if (!speech.ok) throw new Error(`Speech failed: ${await speech.text()}`);
      player.src = URL.createObjectURL(await speech.blob());
      try { await player.play(); status.textContent = 'Speaking…'; }
      catch { status.textContent = 'Reply ready — press play.'; }
      player.onended = () => {
        status.textContent = 'Ready';
        if (continuous) start(true);
      };
    }

    async function ask(text, onboardingKey = null) {
      if (!text) return false;
      answer.textContent = '';
      controller = new AbortController();
      const response = await fetch('/v1/chat', {
        method: 'POST', signal: controller.signal, headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turn_id: turnId, message: text, history: history.slice(-12), onboarding_key: onboardingKey }),
      });
      if (!response.ok) throw new Error(`Chat failed: ${await response.text()}`);
      const reader = response.body.getReader();
      const decoder = new TextDecoder(); let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const events = buffer.split('\n\n'); buffer = events.pop();
        for (const event of events) {
          const data = event.split('\n').find(line => line.startsWith('data: '));
          if (!data) continue;
          const payload = JSON.parse(data.slice(6));
          if (event.startsWith('event: token')) answer.textContent += payload.text;
        }
      }
      if (!answer.textContent || controller.signal.aborted) return false;
      await speak(answer.textContent);
      return true;
    }

    async function reply(text) {
      transcript.textContent = text; messageInput.value = text; answer.textContent = '';
      status.textContent = 'Thinking…';
      try {
        const onboardingKey = promptedOnboardingKey; promptedOnboardingKey = null;
        if (!await ask(text, onboardingKey)) {
          status.textContent = 'Ready';
          if (continuous) setTimeout(() => start(true), 300);
          return;
        }
        history.push({ role: 'user', content: text }, { role: 'assistant', content: answer.textContent });
        if (history.length > 12) history.splice(0, history.length - 12);
        await Promise.all([refreshProfile(), refreshHistory()]);
        if (onboardingKey === 'name') promptedOnboardingKey = 'birth_year';
        if (onboardingKey === 'birth_year') promptedOnboardingKey = 'music_preferences';
        if (onboardingKey === 'music_preferences') promptedOnboardingKey = 'played_instrument';
        if (onboardingKey === 'played_instrument') promptedOnboardingKey = 'can_whistle';
        if (onboardingKey === 'can_whistle') promptedOnboardingKey = 'childhood_song';
        if (onboardingKey === 'childhood_song') promptedOnboardingKey = 'strong_memory_song';
        if (onboardingKey === 'strong_memory_song') promptedOnboardingKey = 'memorable_item';
        if (onboardingKey === 'memorable_item') promptedOnboardingKey = /\b(?:skip|done|not now|no thanks)\b/i.test(text) ? null : 'memorable_item';
        renderProfile();
      } catch (error) {
        status.textContent = controller?.signal.aborted ? 'Interrupted' : error.message;
        if (continuous) setTimeout(() => start(true), 300);
      }
    }

    async function start(automatic = false) {
      if (automatic && !continuous) return;
      continuous = true; endingTurn = false; speechSeen = false;
      if (!automatic && profileState.auto_start_onboarding && profileState.onboarding) {
        await interrupt(); turnId = newTurn(); controller = new AbortController();
        promptedOnboardingKey = profileState.onboarding.key;
        answer.textContent = `Welcome today. ${profileState.onboarding.question}`;
        status.textContent = 'Companion is starting…';
        await speak(answer.textContent);
        return;
      }
      context = new AudioContext();
      context.resume();
      await interrupt();
      turnId = newTurn(); transcript.textContent = ''; answer.textContent = '';
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (error) { stopCapture(); status.textContent = `Microphone: ${error.message}`; return; }
      socket = new WebSocket(`${location.origin.replace('http', 'ws')}/v1/live/${turnId}`);
      source = context.createMediaStreamSource(stream);
      processor = context.createScriptProcessor(4096, 1, 1);
      audioFrames = 0;
      processor.onaudioprocess = event => {
        const input = event.inputBuffer.getChannelData(0);
        const pcm = new Int16Array(input.length);
        input.forEach((sample, index) => pcm[index] = Math.max(-1, Math.min(1, sample)) * 32767);
        if (++audioFrames % 8 === 0) {
          const level = Math.sqrt(input.reduce((sum, sample) => sum + sample * sample, 0) / input.length);
          status.textContent = `Listening… input ${Math.round(level * 100)}%`;
          if (level >= SPEECH_THRESHOLD) { speechSeen = true; lastSpeechAt = performance.now(); }
          if (speechSeen && performance.now() - lastSpeechAt >= SILENCE_MS) finishTurn();
        }
        event.outputBuffer.getChannelData(0).fill(0);
        if (socket.readyState === WebSocket.OPEN) socket.send(pcm.buffer);
      };
      source.connect(processor); processor.connect(context.destination);
      socket.onopen = () => socket.send(JSON.stringify({ type: 'start', sample_rate: context.sampleRate }));
      socket.onerror = () => status.textContent = 'Microphone connection failed.';
      socket.onmessage = async ({ data }) => {
        const message = JSON.parse(data);
        if (message.type === 'partial') transcript.textContent = message.text;
        if (message.type === 'error') status.textContent = message.detail;
        if (message.type === 'final') {
          if (!message.text) {
            status.textContent = 'No speech detected — listening again.';
            if (continuous) setTimeout(() => start(true), 300);
            return;
          }
          await reply(message.text);
        }
      };
      button.textContent = 'End session'; button.id = 'recording'; status.textContent = 'Listening…';
    }

    function finishTurn() {
      if (endingTurn || !processor) return;
      endingTurn = true;
      const stopMessage = JSON.stringify({ type: 'stop' });
      if (socket?.readyState === WebSocket.OPEN) socket.send(stopMessage);
      else socket?.addEventListener('open', () => socket.send(stopMessage), { once: true });
      stopCapture();
      status.textContent = 'Transcribing…';
    }

    function endSession() {
      continuous = false;
      if (processor) finishTurn();
      else interrupt();
      button.textContent = 'Start listening'; button.id = 'record';
    }

    button.onclick = () => continuous ? endSession() : start();
    renderProfile();
    refreshHistory();
    messageForm.onsubmit = async event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;
      await interrupt(); turnId = newTurn(); await reply(text);
    };
  </script>
</html>
